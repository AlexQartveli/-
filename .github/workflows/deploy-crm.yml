name: Deploy CRM to kinetiks.online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-crm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for /crm/ (kinetiks.online link)
        working-directory: frontend
        env:
          VITE_BASE: /crm/
          VITE_USE_LOCAL_API: 'true'
          VITE_API_URL: https://kinetix-api.onrender.com/api
        run: npm run build && cp dist/index.html dist/404.html

      - name: Deploy to AlexQartveli/crm gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          external_repository: AlexQartveli/crm
          publish_branch: gh-pages
          publish_dir: frontend/dist
